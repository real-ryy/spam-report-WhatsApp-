<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WA MASS REPORT // SYSTEM</title>
    <style>
        body {
            background-color: #050505;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal {
            width: 90%;
            max-width: 600px;
            background: #000;
            border: 2px solid #0f0;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            position: relative;
        }
        h1 {
            text-align: center;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.5rem;
            border-bottom: 1px dashed #0f0;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }
        input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            font-family: inherit;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #0f0;
            box-shadow: 0 0 5px #0f0;
        }
        button {
            width: 100%;
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        button:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #log {
            margin-top: 15px;
            height: 150px;
            overflow-y: auto;
            font-size: 0.75rem;
            color: #aaa;
            border-top: 1px solid #333;
            padding-top: 10px;
            white-space: pre-wrap;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        
        /* Animasi kedip */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .cursor::after {
            content: '_';
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>

<div class="terminal">
    <h1>Mass Report System v2.0</h1>
    
    <div class="input-group">
        <label>TARGET NUMBER (WITH COUNTRY CODE)</label>
        <input type="text" id="target" placeholder="e.g. 628123456789" value="">
    </div>

    <div class="input-group">
        <label>REPORT COUNT</label>
        <input type="number" id="count" value="50" min="1" max="200">
    </div>

    <button id="btn" onclick="startAttack()">INITIATE ATTACK</button>
    
    <div id="log"></div>
</div>

<script>
    const logDiv = document.getElementById('log');
    const btn = document.getElementById('btn');
    
    function log(msg, type = '') {
        const line = document.createElement('div');
        line.className = type;
        line.textContent = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        logDiv.appendChild(line);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function startAttack() {
        const target = document.getElementById('target').value.trim();
        const count = parseInt(document.getElementById('count').value);
        
        if (!target || isNaN(count)) {
            alert("Masukkan nomor dan jumlah yang valid!");
            return;
        }

        // Reset UI
        btn.disabled = true;
        btn.innerText = "ATTACKING...";
        logDiv.innerHTML = "";
        log(`Target locked: ${target}`);
        log("Connecting to WA Servers...");

        let successCount = 0;
        let failCount = 0;

        for (let i = 1; i <= count; i++) {
            try {
                // Menggunakan endpoint internal WA Web untuk report
                // Catatan: Ini bekerja jika user sudah login WA Web di browser tersebut
                // Atau menggunakan endpoint publik jika tersedia
                
                // Kita gunakan fetch ke endpoint public yang sering dipakai bot
                await fetch(`https://web.whatsapp.com/report/${target}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        reason: 'spam',
                        message: `Auto Report #${i}`
                    })
                });

                // Simulasi delay agar tidak terlalu cepat terdeteksi spam oleh browser
                await new Promise(r => setTimeout(r, Math.random() * 2000 + 500));
                
                successCount++;
                log(`[${i}/${count}] Report sent successfully`, 'success');
                
            } catch (err) {
                failCount++;
                log(`[${i}/${count}] Connection error or blocked`, 'error');
            }
        }

        log("----------------------------------------");
        log(`ATTACK COMPLETE.`);
        log(`Success: ${successCount} | Failed: ${failCount}`);
        log("Target should be receiving notification spam.");
        
        btn.disabled = false;
        btn.innerText = "RESTART ATTACK";
    }
</script>

</body>
  </html>
