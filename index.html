<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Report Spam Tool</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d0d0d;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #00ff00;
            text-align: center;
            width: 300px;
        }
        input, button {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00;
            background-color: #000;
            color: #fff;
            border-radius: 5px;
        }
        button {
            cursor: pointer;
            background-color: #00ff00;
            color: #000;
            font-weight: bold;
        }
        button:hover {
            background-color: #00cc00;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚫 Mass Report Bot</h2>
    <input type="text" id="phoneNumber" placeholder="Nomor Target (628xxx)">
    <input type="number" id="reportCount" placeholder="Jumlah Laporan" value="100">
    <button onclick="startSpam()">START SPAMING</button>
    <div id="status"></div>
</div>

<script>
    async function startSpam() {
        const phone = document.getElementById('phoneNumber').value.replace(/[^0-9]/g, '');
        const count = parseInt(document.getElementById('reportCount').value);
        const statusDiv = document.getElementById('status');
        
        if (!phone || !count) {
            alert("Masukkan nomor dan jumlah laporan!");
            return;
        }

        statusDiv.innerText = "Memulai spam...";
        
        for (let i = 0; i < count; i++) {
            try {
                // Mengirim permintaan report ke endpoint WhatsApp Web
                await fetch(`https://web.whatsapp.com/report/${phone}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        reason: 'spam',
                        message: 'Laporan massal otomatis'
                    })
                });
                
                statusDiv.innerText = `Laporan ${i + 1}/${count} terkirim.`;
                
                // Jeda antar laporan agar tidak terdeteksi bot langsung
                await new Promise(r => setTimeout(r, 1000)); 
            } catch (error) {
                statusDiv.innerText = `Error pada laporan ${i + 1}: ${error.message}`;
            }
        }
        
        statusDiv.innerText = "Selesai! Nomor target kemungkinan besar akan kena banned.";
    }
</script>

</body>
</html>
